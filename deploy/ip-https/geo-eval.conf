server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/geo-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    client_max_body_size 50m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/geo-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        root /opt/general-geo-eval/frontend/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
    # index.html 不缓存：Vite 的 assets 是 hash 文件名可长缓存，但 index.html
    # 引用它们，若被浏览器缓存会一直加载旧 chunk（前端更新后看不到新功能）。
    location = /index.html {
        root /opt/general-geo-eval/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
    location /api/evaluations/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}

server {
    listen 80;
    server_name 117.50.195.148;
    client_max_body_size 50m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/geo-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location / { return 308 https://117.50.195.148$request_uri; }
}
